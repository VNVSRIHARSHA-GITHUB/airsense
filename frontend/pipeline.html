<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirSense — pipeline console</title>
  <meta name="description" content="Status of the AirSense data and model pipeline">
  <script>
    // theme before the first paint: the saved choice, else the laptop's setting
    (function () {
      var t = null;
      try { t = localStorage.getItem("airsense-theme"); } catch (e) {}
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    })();
  </script>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..900&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="console">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="AirSense home">
      <img src="assets/icon.svg" alt="" width="34" height="34">
      <span class="wordmark">AirSense</span>
    </a>
    <div class="top-actions">
      <nav class="topnav" id="topnav" aria-label="Pages">
        <a href="index.html">Forecast</a>
        <a href="pipeline.html" aria-current="page">Pipeline console</a>
      </nav>
      <button id="theme-toggle" class="icon-btn" type="button"></button>
      <button id="menu-toggle" class="icon-btn menu-btn" type="button" aria-label="Pages" aria-controls="topnav" aria-expanded="false"></button>
    </div>
    <p class="tagline">Pipeline console: is the data arriving, is every step up to date, which model is live</p>
    <div class="freshness">
      <span id="asof">Loading…</span>
      <button id="refresh" class="ghost" type="button">Refresh</button>
    </div>
  </header>

  <main>
    <div id="banner" class="banner" role="alert" hidden></div>

    <section class="status-row" id="status-row" aria-label="Summary"></section>

    <section class="card console-tabs" id="console-tabs" aria-label="Details"></section>
  </main>

  <footer class="footer">
    <p>Read-only view built from the pipeline's own records (Airflow run log, DVC, step reports, MLflow Model Registry, collector logs). Refreshes every minute.</p>
  </footer>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/pipeline.js"></script>
</body>
</html>
