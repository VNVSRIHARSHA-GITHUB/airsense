forecast:
  horizon_hours: 24
sources:
  datagov:
    resource_id: "3b01bcb8-0b14-4abf-b6f2-c1bfd384ba69"
    min_records: 200  
validation:
  raw:
    max_missing_frac: 0.5      # warn if more than 50% of a station's PM2.5 hours are empty
