data:
  cities:               # chosen in EDA (notebooks/01_eda.ipynb): >=97% coverage
                        # since 2020 except Pune (84%), and >=2 live stations each.
                        # lat/lon = mean of each city's live CPCB station locations.
    Delhi:      {lat: 28.6380, lon: 77.1582, region: North}
    Lucknow:    {lat: 26.8546, lon: 80.9491, region: North}
    Patna:      {lat: 25.5983, lon: 85.0939, region: North}
    Kanpur:     {lat: 26.4493, lon: 80.3250, region: North}
    Jaipur:     {lat: 26.8934, lon: 75.7890, region: North}
    Chandigarh: {lat: 30.7435, lon: 76.7693, region: North}
    Mumbai:     {lat: 19.0797, lon: 72.8643, region: West}
    Ahmedabad:  {lat: 23.0333, lon: 72.5655, region: West}
    Pune:       {lat: 18.5147, lon: 73.8634, region: West}
    Bengaluru:  {lat: 12.9659, lon: 77.5800, region: South}
    Chennai:    {lat: 13.0765, lon: 80.2498, region: South}
    Hyderabad:  {lat: 17.4660, lon: 78.3891, region: South}
    Kolkata:    {lat: 22.5607, lon: 88.3673, region: East}
    Guwahati:   {lat: 26.1702, lon: 91.7037, region: East}
  pollutant: pm2.5

forecast:
  horizon_hours: 24

sources:
  datagov:
    resource_id: "3b01bcb8-0b14-4abf-b6f2-c1bfd384ba69"
    min_records: 200     # below this a snapshot is logged as partial (typical: ~520)

validation:
  raw:
    max_missing_frac: 0.5      # warn if more than 50% of a station's PM2.5 hours are empty
    cap_value: 1000            # instrument/dataset ceiling seen in EDA
    min_below_cap_frac: 0.999  # warn if more than 0.1% of readings sit at the cap
  processed:
    coverage_since: "2020-01-01"   # warn if a city's 24-h coverage since this date ...
    min_coverage_frac: 0.9         # ... is below 90%
    max_live_age_hours: 4          # normal age ~2.5 h: 1 h label convention + ~1 h CPCB lag + <=30 min collection
    min_live_stations: 2           # warn if any live hour has fewer stations

processing:
  spark_master: "local[*]"    # design choice A: local mode, all CPU cores
  driver_memory: "6g"         # memory for Spark (leaves ~8 GB for everything else)
  shuffle_partitions: 24      # parallel tasks when grouping (default 200 is too many for this data)
  stuck_run_hours: 24         # >= this many identical consecutive hours = stuck sensor
  avg_window_hours: 24        # live avg_value = 24 h rolling mean (confirmed on 46 h and on a 28 h continuous stretch)
  min_valid_hours: 16         # CPCB minimum data rule for the 24-hour average

live:
  time_offset_hours: -1   # live last_update = END of the 24-h window; history labels
                          # each hour by its START (Kaggle "From Date"), so subtract 1 h

weather:
  archive:                     # Open-Meteo archive (reanalysis) for training
    start_date: "2017-01-01"   # one year before training starts: room for the 72-h lags
    end_date: "2023-12-31"     # end of the CPCB history's last year
    pause_s: 65                # seconds between yearly requests: a year of 14 cities counts
                               # as hundreds of API calls (free tier: 600 per minute)
  validation:                  # warning thresholds (validate_weather.py); physical limits are in the code
    max_missing_frac: 0.001    # warn if more than 0.1% of a variable's hours are empty (archive: expect 0)
    plausible:                 # warn on values outside these ranges for Indian cities [min, max]
      temperature_2m: [-10, 50]      # deg C
      surface_pressure: [850, 1050]  # hPa (Bengaluru, ~920 m altitude, sits near 910)
      wind_speed_10m: [0, 100]       # km/h (cyclones can exceed this on the coast)
      precipitation: [0, 100]        # mm in one hour

features:                        # Stage 3 feature engineering
  train_start: "2018-01-01"      # first training row; earlier hours only feed the lags
  lags_hours: [1, 3, 6, 12, 24, 48, 72]   # pm25_24h this many hours before t
  change_hours: [1, 6, 24]       # pm25_24h(t) - pm25_24h(t - k)
  rolling_hours: 72              # longest look-back: mean and max over t-71 .. t
  rolling_min_hours: 24          # rolling value only if at least this many hours are present
  rain_window_hours: 24          # rain over the last 24 h
  weather_offset_minutes: 30     # PM2.5 hour hh:30-hh+1:30 UTC gets the weather at hh+1:00 (its middle)
  local_timezone: "Asia/Kolkata" # calendar features in Indian time
  festival_window_days: 2        # Diwali flag = Diwali date +/- 2 days (local dates)
  diwali_dates: ["2017-10-19", "2018-11-07", "2019-10-27", "2020-11-14", "2021-11-04",
                 "2022-10-24", "2023-11-12", "2024-10-31", "2025-10-20", "2026-11-08"]
  materialize_days: 7           # online store: load live features of the last 7 days (newest per city wins)

train:                           # Stage 4
  split:                         # by time; the day between an end and the next start is left out
    train_end: "2022-01-01"      # train: targets before this
    val_start: "2022-01-02"      # validation: forecasts from here ...
    val_end: "2022-10-01"        # ... with targets before this
    test_start: "2022-10-02"     # test: Oct 2022 - Mar 2023 (winter, Diwali 2022)
  lgbm:                          # LightGBM settings (tried in DVC experiments, logged in MLflow)
    objective: regression_l1     # L1 loss = mean absolute error, our main metric
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 200
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    max_bin: 255
    num_threads: 0               # 0 = all CPU cores
    deterministic: true          # same data + settings -> same model
    force_row_wise: true
    seed: 42
    verbose: -1
  num_boost_round: 2000          # upper limit; early stopping picks the real number
  early_stopping_rounds: 50      # stop when validation error has not improved for 50 trees
  train_fraction: 1.0            # share of training rows used (lower it, e.g. 0.5, if memory is tight)
  target_mode: change            # "level" = predict PM2.5; "change" = predict the change from now
  shap_sample: 5000              # test rows explained with SHAP
  live_weight_share: 0.1         # live rows (data/training_live): 10% of the training rows, by repeating each ...
  live_repeat_max: 20            # ... at most 20 times (few days of data: no memorising)
  live_holdout_days: 2           # newest 2 days of live data: not trained on, error reported ("recent live")
  mlflow_experiment: airsense-pm25

gate:                            # Stage 5 sanity gate, checked on VALIDATION
  min_skill: 0.05                # overall: at least 5% lower MAE than persistence
  horizon_tolerance: 1.05        # every horizon: model MAE <= 1.05 x persistence MAE
  min_city_skill: -0.05          # every city: at most 5% worse than persistence
  min_aqi_accuracy: 0.70         # AQI category right in at least 70% of forecasts
  prediction_range: [0, 1000]    # forecasts must be finite and in the possible range (ug/m3)
  max_no_forecast_share: 0.01    # "change" mode: at most 1% of hours without a forecast (no current value)

registry:                        # MLflow Model Registry, champion / challenger
  model_name: airsense-pm25
  min_improvement: 0.01          # challenger must beat the re-scored champion's validation MAE by >= 1%

serving:                         # Stage 6 backend
  model_server_url: http://127.0.0.1:5002   # `mlflow models serve` of the champion
  weather_cache_minutes: 30      # one Open-Meteo forecast call per 30 min for all cities
  weather_retry_minutes: 5       # after a failed call, wait before trying again
  weather_timeout_seconds: 10    # one Open-Meteo attempt per request, then the saved forecast
  weather_past_days: 2           # past hours needed for "now" weather and 24 h rain
  weather_forecast_days: 3       # covers t+24 h for every city
  top_factors: 6                 # factors shown in the explanation (plus "all other factors")
  pipeline_cache_seconds: 60     # console data rebuilt at most once a minute
  dvc_status_timeout_seconds: 60 # dvc status for the console gives up after this
  airflow_url: http://localhost:8081   # Airflow UI, linked from the console (Stage 9)
  grafana_url: http://localhost:3000   # monitoring tools, linked and embedded on the console's
  prometheus_url: http://localhost:9090  # Monitoring tab (Stage 10); local to the laptop only
  alertmanager_url: http://localhost:9093

guidance:                        # Stage 6 health guidance search
  docs_dir: guidance_docs
  qdrant_url: http://localhost:6333   # Qdrant server (container); env QDRANT_URL overrides
  collection: guidance
  embedding_model: sentence-transformers/all-MiniLM-L6-v2

monitoring:                      # Stage 10: is the model still good?
  eval_window_days: 3            # forecast vs actual over the last 3 days
  error_ratio_limit: 1.5         # alert: error > 1.5 x test error ...
  min_pairs: 100                 # ... and worse than "no change", with >= 100 forecast/actual pairs
  drift_days: 7                  # live data of the last 7 days ...
  drift_months: [10, 11]         # ... against training rows of the same months (Oct-Nov)
  min_live_rows: 200             # fewer live values: "not enough data", no PSI
  psi_moderate: 0.2              # PSI above: moderate change (amber)
  psi_drift: 0.3                 # PSI above: drift (alert, may trigger a retrain)
  drift_hour_ist: 22             # the hourly monitor run at 22:50 IST also checks drift
  auto_retrain: true             # trigger airsense_retrain on drift or high error
  retrain_cooldown_days: 3       # at most one automatic retrain every 3 days
