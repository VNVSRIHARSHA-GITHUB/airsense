# nginx for the AirSense frontend container (Stage 8).
# Serves the pages and forwards /api/... to the backend container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. Looking the backend up per request (through the
    # variable below) instead of once at start-up means: a stopped backend fails
    # at once instead of after a 60 s timeout, and a recreated backend with a new
    # address is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # /api/forecast/Delhi -> http://backend:8000/forecast/Delhi
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        # backend not running or not answering: a JSON message the pages can show
        proxy_intercept_errors off;
        error_page 502 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"detail": "The AirSense service (backend) is not running or not answering. Try again in a minute."}';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # pages and config change with each version; vendored libraries rarely
    location /vendor/ {
        expires 7d;
    }

    # no "favicon not found" lines in the log
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }
}
