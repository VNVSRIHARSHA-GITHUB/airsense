# nginx for the AirSense frontend container (Stage 8).
# Serves the pages and forwards /api/... to the backend container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/forecast/Delhi -> http://backend:8000/forecast/Delhi
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # pages and config change with each version; vendored libraries rarely
    location /vendor/ {
        expires 7d;
    }

    # no "favicon not found" lines in the log
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }
}
