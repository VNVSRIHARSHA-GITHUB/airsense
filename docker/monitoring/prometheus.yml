# Prometheus for AirSense (Stage 10). Reads the backend's /metrics every 30 s,
# evaluates the alert rules, and sends firing alerts to Alertmanager.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend          # the AirSense API (counted requests + read-on-scrape values)
    static_configs:
      - targets: ["backend:8000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
