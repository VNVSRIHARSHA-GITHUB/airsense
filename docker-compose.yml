# AirSense serving system (Stage 8) and its monitoring (Stage 10): eight
# containers on one private network.
#
#   browser -> frontend (nginx, :8080) -> /api -> backend (FastAPI, :8000)
#   backend -> model-server (MLflow, :5002)   24-hour forecast
#           -> redis (:6379)                  Feast online features
#           -> qdrant (:6333)                 health-guidance search
#   prometheus (:9090) reads backend /metrics every 30 s, evaluates the alert rules
#   alertmanager (:9093) sends alerts to backend POST /alerts (-> logs/alerts/)
#   grafana (:3000) dashboards over Prometheus
#
# Only the frontend is reachable from other machines (port 8080). The backend,
# Redis, Qdrant and the three monitoring tools are published on 127.0.0.1 only: the backend for /docs, Redis
# and Qdrant so the DVC pipeline on the laptop (feast_online, guidance_index) can
# fill them. The model server has no published port at all.
#
# The project folder is mounted read-only at the SAME absolute path, because the
# MLflow database and the Feast registry store absolute paths. Run from the
# project root:
#   AIRSENSE_TAG=$(git rev-parse --short HEAD) docker compose up -d --build

# Backend and model server run the same image. Only model-server builds it:
# two services building one image tag in parallel collide ("already exists").
x-app: &app
  image: airsense-app:${AIRSENSE_TAG:-dev}
  restart: unless-stopped
  environment: &app-env
    AIRSENSE_ROOT: ${PWD}
    MLFLOW_TRACKING_URI: sqlite:///${PWD}/mlflow.db
  volumes: &app-volumes
    - ${PWD}:${PWD}:ro

services:
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "200mb"]
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
    mem_limit: 512m
    healthcheck:  # the image has no curl; bash can open a TCP connection itself
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5

  model-server:
    <<: *app
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["bash", "model_server/serve.sh"]
    environment:
      <<: *app-env
      MODEL_SERVER_HOST: 0.0.0.0
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/ping', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  backend:
    <<: *app
    pull_policy: never  # built by model-server above, never from a registry
    environment:
      <<: *app-env
      MODEL_SERVER_URL: http://model-server:5002
      QDRANT_URL: http://qdrant:6333
      REDIS_CONNECTION: redis:6379
    volumes:
      - ${PWD}:${PWD}:ro
      # DVC's scratch folder for `dvc status` (console): the backend's OWN empty
      # copy in memory, never the laptop's .dvc/tmp. Sharing it broke retrains:
      # inside the container the laptop's process IDs do not exist, so DVC took
      # the running `dvc repro` for a killed process and removed its lock entry.
      - type: tmpfs
        target: ${PWD}/.dvc/tmp
        tmpfs: {mode: 01777}
      # the other places the backend writes: the saved Open-Meteo forecasts
      # (fallback weather) and the alerts
      - ${PWD}/data/raw/live/openmeteo:${PWD}/data/raw/live/openmeteo
      # alerts from Alertmanager (Stage 10); create it first: mkdir -p logs/alerts
      - ${PWD}/logs/alerts:${PWD}/logs/alerts
      # embedding model already downloaded on the laptop; HF_HUB_OFFLINE=1 in the image
      - ${HOME}/.cache/huggingface:/home/airsense/.cache/huggingface
    ports: ["127.0.0.1:8000:8000"]
    mem_limit: 3g
    depends_on:
      model-server: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 120s  # loads the embedding model before answering

  frontend:
    image: airsense-frontend:${AIRSENSE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports: ["8080:8080"]
    mem_limit: 64m
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ---------- monitoring (Stage 10) ----------
  # Not dependent on the backend: they must keep running (and alert) when it is down.

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./docker/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    environment:
      # admin password from .env (never in Git); viewers need no login (local only)
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      # the Pipeline console shows a few panels inside its Monitoring tab (iframes)
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  redis-data:
  qdrant-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
