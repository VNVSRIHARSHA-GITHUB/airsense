# Feast configuration (Stage 3.5). Paths are relative to this folder.
project: airsense
provider: local
registry: data/registry.db          # feature definitions, written by `feast apply`
online_store:
  type: redis                       # latest live features per city, for serving (container)
  # Address from the laptop; the backend container replaces only the address
  # (REDIS_CONNECTION=redis:6379, applied in airsense.common.settings).
  # retry=null: fail at once when Redis is down instead of the client's default
  # 3 retries with growing waits (~7 s per read); our code retries once itself.
  connection_string: localhost:6379,retry=null,socket_connect_timeout=2,socket_timeout=2
offline_store:
  type: duckdb                      # point-in-time joins in DuckDB (the default "file" store ran out of memory)
entity_key_serialization_version: 3
