[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airsense"
version = "0.1.0"
description = "AirSense: end-to-end AIOps pipeline for 24-hour PM2.5 forecasting"
requires-python = ">=3.12"
# Runtime dependencies are pinned in requirements.txt and installed from there;
# this file only makes the code in src/ importable as the `airsense` package.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: starts a local Spark session (slower, ~10 s once per test run)"]

[tool.ruff]
line-length = 88
target-version = "py312"
